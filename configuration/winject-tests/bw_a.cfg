# Manager for radio A — two bus pairs (no duplicate buses per manager).
# Pair 1 (b2/a1): A->B send. Pair 2 (c3/d4): B->A receive.

winject.device        = 192.168.253.11
winject.local_ip      = 192.168.253.106
winject.console       = 2323
winject.channel       = 1
winject.modulation    = OFDM_24M
winject.power         = 20
winject.mode          = STANDALONE
winject.domain        = 1234
winject.max_rate_kbps = 20000
winject.stats_sec     = 1
winject.skip_console  = 1
winject.forward_base  = 9210

upstream.size = 2

upstream-0.mode             = TCP_SERVER_FORWARDING
upstream-0.bus_tx           = b2
upstream-0.bus_rx           = a1
upstream-0.scheduler_budget = 65536
upstream-0.rcv_buffer_size  = 262144
upstream-0.snd_buffer_size  = 262144
upstream-0.bind_address     = 127.0.0.1:29000

upstream-1.mode             = TCP_CLIENT_FORWARDING
upstream-1.bus_tx           = c3
upstream-1.bus_rx           = d4
upstream-1.scheduler_budget = 65536
upstream-1.rcv_buffer_size  = 262144
upstream-1.snd_buffer_size  = 262144
upstream-1.connect_address  = 127.0.0.1:9001

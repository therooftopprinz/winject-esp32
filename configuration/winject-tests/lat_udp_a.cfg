# Manager A — UDP latency (pair with lat_udp_b.cfg).
# Pair 1 (b2/a1): A->B send. Pair 2 (c3/d4): B->A receive.
# Optional FEC lines are appended by scripts/manager_lat_test.sh.

winject.device        = 192.168.253.11
winject.local_ip      = 192.168.253.106
winject.console       = 22
winject.channel       = 1
# Channel 1-14; channel 14 is 802.11b (DSSS/CCK) only.
winject.modulation    = OFDM_24M
winject.power         = 20
winject.mode          = STANDALONE
winject.domain        = 1234
# UDP bw_test needs headroom above 15 Mbps payload; 10 Mbps capped the air scheduler.
winject.max_rate_kbps = 24000
winject.stats_sec     = 1
winject.skip_console  = 1
winject.forward_base  = 9210

upstream.size = 2

upstream-0.mode             = UDP_SERVER_FORWARDING
upstream-0.tx_bus           = b2
upstream-0.rx_bus           = a1
upstream-0.scheduler_budget = 65536
upstream-0.bind_address     = 127.0.0.1:29000

upstream-1.mode             = UDP_CLIENT_FORWARDING
upstream-1.tx_bus           = c3
upstream-1.rx_bus           = d4
upstream-1.scheduler_budget = 65536
upstream-1.connect_address  = 127.0.0.1:9001

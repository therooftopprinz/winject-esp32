# Manager for radio B — pair with bw_a.cfg.

winject.device        = 192.168.253.12
winject.local_ip      = 192.168.253.106
winject.console       = 2323
winject.channel       = 1
winject.modulation    = OFDM_24M
winject.power         = 20
winject.mode          = STANDALONE
winject.max_rate_kbps = 10000
winject.stats_sec     = 1
winject.skip_console  = 1
winject.forward_base  = 9220

upstream.size = 2

upstream-0.mode             = TCP_CLIENT_FORWARDING
upstream-0.airport          = 22:22:33:AA:BB:CC
upstream-0.scheduler_budget = 65536
upstream-0.rcv_buffer_size  = 262144
upstream-0.snd_buffer_size  = 262144
upstream-0.connect_address  = 127.0.0.1:9002

upstream-1.mode             = TCP_SERVER_FORWARDING
upstream-1.airport          = 44:55:66:AA:BB:CC
upstream-1.scheduler_budget = 65536
upstream-1.rcv_buffer_size  = 262144
upstream-1.snd_buffer_size  = 262144
upstream-1.bind_address     = 127.0.0.1:29001

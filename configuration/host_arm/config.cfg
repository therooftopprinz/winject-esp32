# ARM video source (camera): GStreamer -> manager.
# UDP RTP: bus pair b2/a1 shared with host_x86 sink.
# UDP MPEG-TS (--tcp-gst): second bus pair c3/d4.
# See docs/manager.md, gst.env, start_gst.sh (TRANSPORT=udp|tcp).

winject.device        = 192.168.253.11
winject.local_ip      = 192.168.253.106
winject.console       = 2323
winject.channel       = 1
winject.modulation    = OFDM_24M
winject.power         = 20
winject.mode          = STANDALONE
winject.domain        = 1234
winject.max_rate_kbps = 24000
winject.stats_sec     = 1

upstream.size = 2

# GStreamer udpsink -> manager (RTP/H264)
upstream-0.mode             = UDP_SERVER_FORWARDING
upstream-0.fec.type         = RS_BLOCK_ERASURE
upstream-0.fec.k            = 10
upstream-0.fec.n            = 12
upstream-0.bus_tx           = b2
upstream-0.bus_rx           = a1
upstream-0.scheduler_budget = 4096
upstream-0.bind_address     = 127.0.0.1:22081

# GStreamer udpsink -> manager (MPEG-TS H264, start.sh --tcp-gst)
upstream-1.mode             = UDP_SERVER_FORWARDING
upstream-1.fec.type         = RS_BLOCK_ERASURE
upstream-1.fec.k            = 10
upstream-1.fec.n            = 12
upstream-1.bus_tx           = c3
upstream-1.bus_rx           = d4
upstream-1.scheduler_budget = 16384
upstream-1.bind_address     = 127.0.0.1:22082

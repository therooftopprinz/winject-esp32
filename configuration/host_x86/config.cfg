# x86 video sink (display): manager -> local GStreamer.
# UDP RTP: bus pair a1/b2 shared with host_arm source.
# UDP MPEG-TS (--tcp-gst): second bus pair d4/c3.
# See docs/manager.md, gst.env, start_gst.sh (TRANSPORT=udp|tcp).

winject.device        = 192.168.253.12
winject.console       = 2323
winject.channel       = 1
winject.modulation    = OFDM_24M
winject.power         = 20
winject.mode          = STANDALONE
winject.domain        = 1234
winject.max_rate_kbps = 24000
winject.stats_sec     = 1

upstream.size = 2

# Manager -> GStreamer udpsrc (RTP/H264)
upstream-0.mode             = UDP_CLIENT_FORWARDING
upstream-0.fec.type         = RS_BLOCK_ERASURE
upstream-0.fec.k            = 10
upstream-0.fec.n            = 12
upstream-0.bus_tx           = a1
upstream-0.bus_rx           = b2
upstream-0.scheduler_budget = 4096
upstream-0.connect_address  = 127.0.0.1:21082

# Manager -> GStreamer udpsrc (MPEG-TS H264, start.sh --tcp-gst)
upstream-1.mode             = UDP_CLIENT_FORWARDING
upstream-1.fec.type         = RS_BLOCK_ERASURE
upstream-1.fec.k            = 10
upstream-1.fec.n            = 12
upstream-1.bus_tx           = d4
upstream-1.bus_rx           = c3
upstream-1.scheduler_budget = 16384
upstream-1.connect_address  = 127.0.0.1:21083

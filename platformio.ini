; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; WT32-ETH01 has no onboard USB. Use an external UART adapter.
; Leave upload_port unset to auto-detect, or set it explicitly:
; upload_port = COM3

; Prevent USB-UART adapters from holding the chip in reset via DTR/RTS.
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -D CORE_DEBUG_LEVEL=1

monitor_filters = esp32_exception_decoder

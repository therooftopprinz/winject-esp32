; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
build_src_filter =
    +<winject/>
    +<common/>

monitor_speed = 115200
upload_speed = 115200

; WT32-ETH01 has no onboard USB. Use a 3.3 V USB-UART adapter
; (see docs/flashing.md). Leave upload_port unset to auto-detect:
; upload_port = COM3

; Prevent USB-UART adapters from holding the chip in reset via DTR/RTS.
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -Wl,-z,muldefs

; default.csv has two OTA app slots (required for ArduinoOTA / HTTP update).
board_build.partitions = default.csv

monitor_filters = esp32_exception_decoder

; WT32-ETH01 bring-up: chip info, reset reason, Ethernet link/DHCP.
[env:test]
extends = env:wt32-eth01
build_src_filter =
    +<test/>
    +<common/>

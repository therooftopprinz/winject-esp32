; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-eth01

[env]
platform = espressif32
board = wt32-eth01
framework = espidf
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
build_flags =
    -Wl,-z,muldefs

; WT32-ETH01 has no onboard USB. Use a 3.3 V USB-UART adapter
; (see docs/flashing.md). Leave upload_port unset to auto-detect:
; upload_port = COM3

[env:wt32-eth01]

; WT32-ETH01 bring-up: chip info, reset reason, Ethernet link/DHCP.
[env:test]

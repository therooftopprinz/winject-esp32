; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-eth01

[env]
platform = espressif32
board = wt32-eth01
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
; External USB-UART on WT32 is noisy at higher rates; 115200 already failed
; mid-write ("serial data stream stopped"). Prefer slow+reliable.
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
build_flags =
    -Wl,-z,muldefs
extra_scripts =
    tools/clangd_pio.py
    post:tools/clangd_pio.py
    post:tools/pio_test_target.py

; WT32-ETH01 has no onboard USB. Use a 3.3 V USB-UART adapter
; (see docs/flashing.md). Leave upload_port unset to auto-detect:
; upload_port = COM3

; RMII REF_CLK: stock WT32-ETH01 (50 MHz oscillator → GPIO0).
[env:wt32-eth01]
build_flags =
    ${env.build_flags}
    -DETH_CLK_MODE=ETH_CLK_GPIO0_IN

; Generic ESP32 + LAN8720 modules that take REF_CLK from ESP32 GPIO17.
[env:lan-module]
build_flags =
    ${env.build_flags}
    -DETH_CLK_MODE=ETH_CLK_GPIO17_OUT
